<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Board – Free Online Whiteboard</title>
<style>
:root{--bg:#eef0f4;--p:#fff;--t:#1d2330;--b:#d3d7df;--a:#2563eb;--h:#e3e8f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--p:#1f242d;--t:#e8ebf2;--b:#363c48;--a:#6c9bff;--h:#2c3445;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171d;--p:#1f242d;--t:#e8ebf2;--b:#363c48;--a:#6c9bff;--h:#2c3445;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--t)}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:var(--p);border-bottom:1px solid var(--b)}
.g{display:flex;gap:3px;align-items:center;padding-right:8px;border-right:1px solid var(--b);flex-wrap:wrap}.g:last-child{border:0}
button,select{font:inherit;color:var(--t);background:var(--p);border:1px solid var(--b);border-radius:8px;padding:5px 8px;cursor:pointer}
button:hover{background:var(--h)}button.on{background:var(--a);color:#fff;border-color:var(--a)}
input[type=color]{width:34px;height:30px;padding:0;border:1px solid var(--b);border-radius:8px;background:none}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--b)}
input[type=range]{width:90px}
#main{flex:1;display:flex;min-height:0;position:relative}
#side{width:210px;flex:none;background:var(--p);border-right:1px solid var(--b);overflow:auto;padding:8px}
#side.hide{display:none}
#side h4{margin:8px 0 6px;display:flex;justify-content:space-between;align-items:center}
.fo{display:flex;gap:3px;margin-bottom:4px}.fo input{flex:1;min-width:0;border:1px solid var(--b);border-radius:6px;padding:4px 6px;background:var(--p);color:var(--t);font:inherit}
.fo.act input{border-color:var(--a);font-weight:600}
.pg{position:relative;margin-bottom:8px;border:2px solid var(--b);border-radius:8px;overflow:hidden;cursor:pointer}.pg.act{border-color:var(--a)}
.pg .th{aspect-ratio:16/9;background-size:100% 100%;position:relative}.pg img{width:100%;height:100%;display:block}
.pg small{position:absolute;left:4px;bottom:3px;background:rgba(0,0,0,.6);color:#fff;border-radius:4px;padding:0 5px}
.pg button{position:absolute;right:3px;top:3px;padding:0 5px;font-size:12px}
#stage{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;min-width:0}
#wrap{position:relative;box-shadow:0 2px 14px rgba(0,0,0,.25);flex:none}
#wrap canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#cv{pointer-events:none}#oc{touch-action:none;cursor:crosshair}
#ls{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(255,40,40,.75);box-shadow:0 0 18px 8px rgba(255,40,40,.45);pointer-events:none;display:none}
#ta{position:absolute;background:transparent;border:1px dashed var(--a);outline:0;resize:none;overflow:hidden;font-family:sans-serif;line-height:1.2;padding:0;margin:0;min-width:80px}
#fig{position:absolute;right:0;top:0;bottom:0;width:270px;background:var(--p);border-left:1px solid var(--b);overflow:auto;padding:8px;display:none;z-index:5}
#fig.show{display:block}
#fig h5{margin:10px 0 4px;font-size:13px}.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.fg button{padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px}.fg svg{width:52px;height:52px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg button.on svg{stroke:#fff}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;display:none;z-index:9}
@media(max-width:700px){#side{position:absolute;z-index:6;top:0;bottom:0;left:0}}
</style></head><body>
<div id="bar">
 <div class="g" id="tools">
  <button data-t="pen" title="Pen (P)">✏️ Pen</button><button data-t="hl" title="Highlighter (H)">🖍 Highlight</button>
  <button data-t="eraser" title="Eraser (E)">🧽 Eraser</button><button data-t="laser" title="Pointer (L)">🔴 Pointer</button>
  <button data-t="text" title="Text (T)">🔤 Text</button><button data-t="sel" title="Select (S)">🖱 Select</button>
  <select id="shape" title="Shapes"><option value="">⬡ Shape…</option><option value="line">Line</option><option value="arrow">Arrow</option><option value="rect">Rectangle</option><option value="ell">Circle / Ellipse</option></select>
  <button id="figb">📐 Figures</button>
 </div>
 <div class="g"><select id="pen" title="Pen style"><option value="ball">Ball pen</option><option value="fountain">Fountain pen</option><option value="marker">Marker</option><option value="dash">Dashed pen</option></select></div>
 <div class="g"><input type="color" id="col" value="#111111" title="Ink colour">
  <button class="sw" style="background:#111" data-c="#111111"></button><button class="sw" style="background:#fff" data-c="#ffffff"></button><button class="sw" style="background:#e53935" data-c="#e53935"></button><button class="sw" style="background:#1e88e5" data-c="#1e88e5"></button><button class="sw" style="background:#43a047" data-c="#43a047"></button><button class="sw" style="background:#fdd835" data-c="#fdd835"></button><button class="sw" style="background:#fb8c00" data-c="#fb8c00"></button></div>
 <div class="g"><label>Size <input type="range" id="sz" min="1" max="30" value="4"></label></div>
 <div class="g"><select id="bgs" title="Background"><option value="white">⬜ White</option><option value="black">⬛ Black</option><option value="board">🟩 Green board</option><option value="blue">🟦 Blue</option><option value="cream">🟨 Cream</option><option value="gridw">▦ Grid (white)</option><option value="gridb">▦ Grid (black)</option><option value="ruled">☰ Ruled</option></select></div>
 <div class="g"><button id="undo" title="Undo (Ctrl+Z)">↶</button><button id="redo" title="Redo (Ctrl+Y)">↷</button><button id="clr">🗑 Clear</button><button id="img">🖼 Image</button><input type="file" id="file" accept="image/*" hidden></div>
 <div class="g"><button id="cpb" title="Copy (Ctrl+C)">📋 Copy</button><button id="psb" title="Paste (Ctrl+V)">📄 Paste</button><button id="zi" title="Zoom in selected">🔍＋</button><button id="zo" title="Zoom out selected">🔍－</button><button id="rmb" title="Delete selected">✖ Delete</button></div>
 <div class="g"><button id="sv" title="Save (Ctrl+S)">💾 Save</button><select id="exp"><option value="">⬇ Export…</option><option value="pg">PDF – this page</option><option value="fo">PDF – whole folder</option></select><button id="fs">⛶</button><button id="sb">☰ Pages</button><label title="Ignore finger touch (stylus only)"><input type="checkbox" id="po"> Pen only</label></div>
</div>
<div id="main">
 <div id="side"></div>
 <div id="stage"><div id="wrap"><canvas id="bg" width="1600" height="900"></canvas><canvas id="cv" width="1600" height="900"></canvas><canvas id="oc" width="1600" height="900"></canvas></div></div>
 <div id="fig"></div>
</div>
<div id="toast"></div>
<script>
const W=1600,H=900,$=s=>document.querySelector(s),cv=$('#cv'),cx=cv.getContext('2d',{willReadFrequently:true}),bgc=$('#bg'),bx=bgc.getContext('2d'),wrap=$('#wrap'),stage=$('#stage');
const BG={white:['#ffffff'],black:['#111111'],board:['#1f4d3a'],blue:['#0f2a4a'],cream:['#fdf6e3'],gridw:['#ffffff','g'],gridb:['#111111','g'],ruled:['#ffffff','l']};
const dark=k=>['black','board','blue','gridb'].includes(k);
function drawBg(c,k){const[col,m]=BG[k];c.fillStyle=col;c.fillRect(0,0,W,H);if(m){c.strokeStyle=dark(k)?'rgba(255,255,255,.16)':'rgba(0,0,0,.13)';c.lineWidth=1;c.beginPath();for(let y=0;y<=H;y+=50){c.moveTo(0,y);c.lineTo(W,y)}if(m=='g')for(let x=0;x<=W;x+=50){c.moveTo(x,0);c.lineTo(x,H)}c.stroke()}}
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.i);toast.i=setTimeout(()=>t.style.display='none',2600)};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ---------- data ---------- */
const oc=$('#oc'),ox=oc.getContext('2d');
let S=null;try{S=JSON.parse(localStorage.getItem('sb1'))}catch(e){}
if(!S||!S.f)S={f:[{id:1,n:'Folder 1',p:[{id:1,bg:'white',ink:'',o:[]}]}],cf:1,cp:1,n:2};
S.f.forEach(f=>f.p.forEach(p=>{if(p.img!==undefined){p.ink=p.img;delete p.img}p.ink=p.ink||'';p.o=p.o||[]}));
const save=m=>{try{localStorage.setItem('sb1',JSON.stringify(S));if(m)toast('✔ Saved')}catch(e){toast('Storage full – delete some pages or images')}};
const F=()=>S.f.find(f=>f.id==S.cf),P=()=>F().p.find(p=>p.id==S.cp);
let O=[],sel=null,undo=[],redo=[],last={k:'',o:'[]'},IM={},pv=null,mq=null,lt=[],lv=true,liv=null,clip=null,sv;
const im=s=>{let i=IM[s];if(!i){i=IM[s]=new Image;i.onload=()=>render();i.src=s}return i};
function paint(u){const i=new Image;i.onload=()=>{cx.globalCompositeOperation='source-over';cx.clearRect(0,0,W,H);cx.drawImage(i,0,0)};i.src=u}
function thumb(){const c=document.createElement('canvas');c.width=320;c.height=180;const x=c.getContext('2d');x.scale(.2,.2);drawBg(x,P().bg);x.drawImage(cv,0,0);O.forEach(o=>drawO(x,o));P().th=c.toDataURL('image/jpeg',.6)}
function later(){clearTimeout(sv);sv=setTimeout(()=>{thumb();save();side()},400)}
function commit(ink){const p=P();undo.push(last);if(undo.length>20)undo.shift();redo=[];if(ink)p.ink=cv.toDataURL();last={k:p.ink,o:JSON.stringify(O)};later()}
function load(){const p=P();O=p.o;sel=null;pv=null;$('#bgs').value=p.bg;drawBg(bx,p.bg);cx.clearRect(0,0,W,H);undo=[];redo=[];last={k:p.ink,o:JSON.stringify(O)};if(p.ink)paint(p.ink);render();side()}
function rs(){const p=P();p.ink=last.k;p.o=JSON.parse(last.o);O=p.o;sel=null;last.k?paint(last.k):cx.clearRect(0,0,W,H);render();later()}
$('#undo').onclick=()=>{if(!undo.length)return;redo.push(last);last=undo.pop();rs()};
$('#redo').onclick=()=>{if(!redo.length)return;undo.push(last);last=redo.pop();rs()};
$('#clr').onclick=()=>{cx.clearRect(0,0,W,H);O.length=0;sel=null;commit(true);render()};
$('#sv').onclick=()=>{thumb();save(1);side();try{navigator.storage.persist()}catch(e){}};
/* ---------- objects ---------- */
function arrow(c,x1,y1,x2,y2,w){const t=Math.atan2(y2-y1,x2-x1),L=14+w*3,a=.45;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2-L*.8*Math.cos(t),y2-L*.8*Math.sin(t));c.stroke();c.beginPath();c.moveTo(x2,y2);c.lineTo(x2-L*Math.cos(t-a),y2-L*Math.sin(t-a));c.lineTo(x2-L*Math.cos(t+a),y2-L*Math.sin(t+a));c.closePath();c.fill()}
function drawO(c,o){c.save();c.globalAlpha=1;c.globalCompositeOperation='source-over';c.lineCap=c.lineJoin='round';c.setLineDash([]);
 if(o.t=='i'){const i=im(o.s);if(i.complete)c.drawImage(i,o.x,o.y,o.w,o.h)}
 else if(o.t=='x'){c.fillStyle=o.c;c.font=o.f+'px sans-serif';c.textBaseline='top';o.s.split('\n').forEach((l,k)=>c.fillText(l,o.x,o.y+k*o.f*1.2))}
 else{c.strokeStyle=c.fillStyle=o.c;c.lineWidth=o.w;const{x1,y1,x2,y2}=o;
  if(o.k=='line'){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
  else if(o.k=='arrow')arrow(c,x1,y1,x2,y2,o.w);
  else{c.beginPath();o.k=='rect'?c.rect(x1,y1,x2-x1,y2-y1):c.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,7);c.stroke()}}
 c.restore()}
function bb(o){if(o.t=='i')return{x:o.x,y:o.y,w:o.w,h:o.h};
 if(o.t=='x'){ox.font=o.f+'px sans-serif';const l=o.s.split('\n');return{x:o.x,y:o.y,w:Math.max(...l.map(s=>ox.measureText(s).width)),h:l.length*o.f*1.2}}
 return{x:Math.min(o.x1,o.x2),y:Math.min(o.y1,o.y2),w:Math.abs(o.x2-o.x1),h:Math.abs(o.y2-o.y1)}}
function mv(o,dx,dy){if(o.t=='i'||o.t=='x'){o.x+=dx;o.y+=dy}else{o.x1+=dx;o.x2+=dx;o.y1+=dy;o.y2+=dy}}
function sc(o,k,a,b){const f=(v,c)=>c+(v-c)*k;
 if(o.t=='i'){o.x=f(o.x,a);o.y=f(o.y,b);o.w*=k;o.h*=k}else if(o.t=='x'){o.x=f(o.x,a);o.y=f(o.y,b);o.f*=k}
 else{o.x1=f(o.x1,a);o.x2=f(o.x2,a);o.y1=f(o.y1,b);o.y2=f(o.y2,b)}}
const hit=q=>[...O].reverse().find(o=>{const b=bb(o);return q.x>=b.x-10&&q.x<=b.x+b.w+10&&q.y>=b.y-10&&q.y<=b.y+b.h+10});
function render(){ox.clearRect(0,0,W,H);O.forEach(o=>drawO(ox,o));if(pv)drawO(ox,pv);
 if(sel){const b=bb(sel);ox.save();ox.strokeStyle='#2563eb';ox.fillStyle='#fff';ox.lineWidth=2;ox.setLineDash([8,6]);ox.strokeRect(b.x-4,b.y-4,b.w+8,b.h+8);ox.setLineDash([]);ox.fillRect(b.x+b.w-4,b.y+b.h-4,16,16);ox.strokeRect(b.x+b.w-4,b.y+b.h-4,16,16);ox.restore()}
 if(mq){ox.save();ox.strokeStyle='#2563eb';ox.lineWidth=2;ox.setLineDash([6,5]);ox.fillStyle='rgba(37,99,235,.08)';ox.fillRect(mq.x,mq.y,mq.w,mq.h);ox.strokeRect(mq.x,mq.y,mq.w,mq.h);ox.restore()}
 if(lt.length&&lv){ox.save();ox.strokeStyle='#ff2a2a';ox.shadowColor='#ff2a2a';ox.shadowBlur=14;ox.lineWidth=6;ox.lineCap=ox.lineJoin='round';ox.beginPath();lt.forEach((p,i)=>i?ox.lineTo(p.x,p.y):ox.moveTo(p.x,p.y));if(lt.length==1)ox.lineTo(lt[0].x+.1,lt[0].y);ox.stroke();ox.restore()}}
const cp=()=>{if(sel){clip=JSON.stringify(sel);toast('Copied')}else toast('Select something first')};
const ps=()=>{if(!clip)return toast('Nothing copied yet');const o=JSON.parse(clip);mv(o,30,30);clip=JSON.stringify(o);setTool('sel');O.push(o);sel=o;commit();render()};
const rm=()=>{if(!sel)return;O.splice(O.indexOf(sel),1);sel=null;commit();render()};
const zm=k=>{if(!sel)return toast('Select something first');const b=bb(sel);sc(sel,k,b.x+b.w/2,b.y+b.h/2);commit();render()};
$('#cpb').onclick=cp;$('#psb').onclick=ps;$('#rmb').onclick=rm;$('#zi').onclick=()=>zm(1.15);$('#zo').onclick=()=>zm(1/1.15);
let mode=null,lp=null,orig=null,b0=null,moved=false;
function selDown(q){down=true;moved=false;lp=q;
 if(sel){const b=bb(sel);if(Math.hypot(q.x-b.x-b.w-4,q.y-b.y-b.h-4)<20){mode='r';b0=b;orig=JSON.stringify(sel);return}}
 const o=hit(q);if(o){sel=o;mode='m';render();return}
 sel=null;mode='q';mq={x:q.x,y:q.y,w:0,h:0};render()}
function selMove(q){moved=true;
 if(mode=='m'){mv(sel,q.x-lp.x,q.y-lp.y);lp=q}
 else if(mode=='r'){const k=Math.max(.1,Math.hypot(q.x-b0.x,q.y-b0.y)/Math.hypot(b0.w+4,b0.h+4));Object.assign(sel,JSON.parse(orig));sc(sel,k,b0.x,b0.y)}
 else if(mode=='q')mq={x:Math.min(st.x,q.x),y:Math.min(st.y,q.y),w:Math.abs(q.x-st.x),h:Math.abs(q.y-st.y)}}
function selUp(){if(mode=='q'){const m=mq;mq=null;if(m.w>6&&m.h>6)pick(m)}else if(moved)commit();mode=null;render()}
function pick(m){const X=Math.max(0,m.x|0),Y=Math.max(0,m.y|0),w=Math.max(1,Math.min(W-X,m.w|0)),h=Math.max(1,Math.min(H-Y,m.h|0));
 const o=[...O].reverse().find(o=>{const b=bb(o);return b.x<m.x+m.w&&b.x+b.w>m.x&&b.y<m.y+m.h&&b.y+b.h>m.y});if(o){sel=o;return}
 const d=cx.getImageData(X,Y,w,h).data;let a=1e9,b=1e9,c=-1,e=-1;
 for(let i=3,k=0;i<d.length;i+=4,k++)if(d[i]>10){const x=k%w,y=(k/w)|0;if(x<a)a=x;if(x>c)c=x;if(y<b)b=y;if(y>e)e=y}
 if(c<0)return toast('Nothing found here');
 const cw=c-a+1,ch=e-b+1,t=document.createElement('canvas');t.width=cw;t.height=ch;t.getContext('2d').drawImage(cv,X+a,Y+b,cw,ch,0,0,cw,ch);
 cx.clearRect(X,Y,w,h);const n={t:'i',s:t.toDataURL(),x:X+a,y:Y+b,w:cw,h:ch};O.push(n);sel=n;commit(true)}
/* ---------- sidebar ---------- */
function side(){let h='<h4>📁 Folders <button data-a="nf">＋</button></h4>';
 S.f.forEach(f=>h+=`<div class="fo ${f.id==S.cf?'act':''}"><input data-fn="${f.id}" value="${esc(f.n)}"><button data-a="of" data-i="${f.id}">▶</button><button data-a="df" data-i="${f.id}">🗑</button></div>`);
 h+='<h4>📄 Pages <button data-a="np">＋</button></h4>';
 F().p.forEach((p,i)=>h+=`<div class="pg ${p.id==S.cp?'act':''}" data-a="op" data-i="${p.id}"><div class="th" style="background-color:${BG[p.bg][0]}">${p.th?`<img src="${p.th}">`:''}</div><small>${i+1}</small><button data-a="dp" data-i="${p.id}">✕</button></div>`);
 $('#side').innerHTML=h}
let sure=null;
$('#side').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=+b.dataset.i;e.stopPropagation();
 if(a=='nf'){const f={id:S.n++,n:'Folder '+(S.f.length+1),p:[{id:S.n++,bg:'white',ink:'',o:[]}]};S.f.push(f);S.cf=f.id;S.cp=f.p[0].id;save();load()}
 else if(a=='of'){S.cf=i;S.cp=F().p[0].id;save();load()}
 else if(a=='op'){S.cp=i;save();load()}
 else if(a=='np'){const p={id:S.n++,bg:P().bg,ink:'',o:[]};F().p.push(p);S.cp=p.id;save();load()}
 else if(a=='df'||a=='dp'){const k=a+i;if(sure!=k){sure=k;toast('Tap delete again to confirm');setTimeout(()=>sure=null,3000);return}sure=null;
  if(a=='df'){if(S.f.length<2)return toast('At least one folder is needed');S.f=S.f.filter(f=>f.id!=i);S.cf=S.f[0].id;S.cp=F().p[0].id}
  else{const f=F();if(f.p.length<2){f.p[0].ink='';f.p[0].o=[];f.p[0].th='';}else f.p=f.p.filter(p=>p.id!=i);S.cp=f.p[0].id}save();load()}});
$('#side').addEventListener('change',e=>{if(e.target.dataset.fn){S.f.find(f=>f.id==e.target.dataset.fn).n=e.target.value||'Folder';save()}});
$('#sb').onclick=()=>$('#side').classList.toggle('hide');
/* ---------- state & tools ---------- */
let tool='pen',pen='ball',col='#111111',size=4,stamp=null,down=false,pts=[],snap=null,lw=4,shape='',st=null;
function setTool(t){tool=t;stamp=null;if(t!='sel'){sel=null;mq=null}document.querySelectorAll('#tools [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t==t));if(t!='shape')$('#shape').value='';document.querySelectorAll('.fg button').forEach(b=>b.classList.remove('on'));oc.style.cursor=t=='text'?'text':t=='sel'?'default':'crosshair';render()}
document.querySelectorAll('#tools [data-t]').forEach(b=>b.onclick=()=>setTool(b.dataset.t));
$('#shape').onchange=e=>{if(e.target.value){const v=e.target.value;setTool('shape');shape=v;$('#shape').value=v}};
$('#pen').onchange=e=>{pen=e.target.value;if(tool!='pen')setTool('pen')};
$('#col').oninput=e=>col=e.target.value;

$('#sz').oninput=e=>size=+e.target.value;
